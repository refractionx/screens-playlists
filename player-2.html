<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screens Playlist Player</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player,
        img,
        video,
        iframe,
        audio {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background: #000;
            display: block;
            overflow: hidden;
        }

        /* Hide all UI elements */
        .container,
        #current,
        #playlist,
        button,
        ul,
        h1 {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="player"></div>
    <div id="current" aria-live="polite"></div>
    <script>
        // URL to the raw markdown file on GitHub
        const baseURL = window.location.href.replace(/player-2.html.*/, '');
        const playlistUrl = `${baseURL}harlem-playlist-1.md`;

        let items = [];
        let currentIndex = 0;
        let itemWatchdog = null;
        let lastProgressAt = Date.now();
        let playbackToken = 0;

        function setStatus(message) {
            const status = document.getElementById('current');
            if (status) status.textContent = message;
        }

        function clearItemTimers() {
            if (imageTimeout) { clearTimeout(imageTimeout); imageTimeout = null; }
            if (itemWatchdog) { clearTimeout(itemWatchdog); itemWatchdog = null; }
        }

        function stopPlayback(message) {
            playbackToken += 1;
            items = [];
            currentIndex = 0;
            clearItemTimers();
            if (ytPlayer && ytPlayer.destroy) { ytPlayer.destroy(); ytPlayer = null; }
            const playerDiv = document.getElementById('player');
            if (playerDiv) playerDiv.innerHTML = '';
            lastProgressAt = Date.now();
            setStatus(message || 'Playlist is empty.');
        }

        function hasMalformedNonEntryContent(md) {
            return md.split('\n').some(raw => {
                const line = raw.trim();
                return line && !line.startsWith('#') && !line.startsWith('<!--');
            });
        }

        function advance(reason, expectedToken) {
            if (!items.length) return;
            if (expectedToken !== undefined && expectedToken !== playbackToken) return;
            setStatus(reason || 'Advancing playlist');
            playItem((currentIndex + 1) % items.length);
        }

        function armWatchdog(seconds, expectedToken) {
            const token = expectedToken === undefined ? playbackToken : expectedToken;
            if (token !== playbackToken) return;
            if (itemWatchdog) clearTimeout(itemWatchdog);
            const safeSeconds = Math.max(10, Math.min(Number(seconds) || 300, 6 * 60 * 60));
            itemWatchdog = setTimeout(() => advance('Media watchdog timeout', token), safeSeconds * 1000);
        }

        function parsePlaylist(md) {
            // Supports: [Title](url) or url, with optional { attr: value, ... }
            return md.split('\n').map(line => {
                line = line.trim();
                if (!line) return null;
                // Extract curly-brace attributes if present
                let attr = {};
                const attrMatch = line.match(/\{([^}]*)\}\s*$/);
                if (attrMatch) {
                    const attrStr = attrMatch[1];
                    line = line.replace(/\{[^}]*\}\s*$/, '').trim();
                    attrStr.split(',').forEach(pair => {
                        const [k, v] = pair.split(':').map(s => s.trim());
                        if (k && v !== undefined) {
                            // Try to parse value as number or boolean, else string
                            let val = v;
                            if (/^\d+s$/.test(v)) val = parseInt(v, 10); // duration in seconds
                            else if (/^\d+m$/.test(v)) val = parseInt(v, 10) * 60; // duration in minutes
                            else if (v === 'true') val = true;
                            else if (v === 'false') val = false;
                            attr[k] = val;
                        } else if (k) {
                            // For flags like { muted }
                            attr[k] = true;
                        }
                    });
                }
                // Markdown link: [Title](url)
                const match = line.match(/\[(.*?)\]\((.*?)\)/);
                if (match) {
                    return { title: match[1], url: match[2], ...attr };
                }
                // Just a URL
                if (/https?:\/\//.test(line)) {
                    return { title: line, url: line, ...attr };
                }
                return null;
            }).filter(Boolean);
        }

        function renderPlaylist() {
            const ul = document.getElementById('playlist');
            ul.innerHTML = '';
            items.forEach((item, idx) => {
                const li = document.createElement('li');
                li.textContent = item.title || item.url;
                if (idx === currentIndex) li.classList.add('active');
                li.onclick = () => playItem(idx);
                ul.appendChild(li);
            });
        }

        let imageTimeout = null;
        let ytPlayer = null;
        function isYouTube(url) {
            return /(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/.test(url);
        }
        function getYouTubeId(url) {
            const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
            return match ? match[1] : null;
        }
        function isImage(url) {
            return /\.(png|jpe?g|gif|bmp|webp)$/i.test(url);
        }
        function playItem(idx) {
            if (!items.length || !Number.isInteger(idx) || idx < 0 || idx >= items.length) return;
            const token = ++playbackToken;
            currentIndex = idx;
            const item = items[idx];
            const playerDiv = document.getElementById('player');
            playerDiv.innerHTML = '';
            clearItemTimers();
            lastProgressAt = Date.now();
            if (ytPlayer && ytPlayer.destroy) { ytPlayer.destroy(); ytPlayer = null; }
            let el;
            if (isYouTube(item.url)) {
                const ytId = getYouTubeId(item.url);
                const ytDiv = document.createElement('div');
                ytDiv.id = 'ytplayer';
                ytDiv.style.width = '100vw';
                ytDiv.style.height = '100vh';
                playerDiv.appendChild(ytDiv);
                armWatchdog(60, token);
                function loadYT() {
                    if (token !== playbackToken) return;
                    ytPlayer = new YT.Player('ytplayer', {
                        videoId: ytId,
                        playerVars: {
                            autoplay: 1,
                            mute: 1,
                            controls: 1,
                            showinfo: 0,
                            rel: 0,
                            modestbranding: 1,
                            fs: 0
                        },
                        events: {
                            'onReady': e => {
                                if (token !== playbackToken) return;
                                lastProgressAt = Date.now();
                                e.target.playVideo();
                                armWatchdog(item.duration || 1800, token);
                            },
                            'onStateChange': e => {
                                if (token !== playbackToken) return;
                                lastProgressAt = Date.now();
                                if (e.data === YT.PlayerState.ENDED) {
                                    // Loop playlist
                                    advance('YouTube item ended', token);
                                } else if (e.data === YT.PlayerState.PLAYING) {
                                    // Backstop only — ENDED (above) handles the normal advance.
                                    // YouTube fires onStateChange on transitions, not continuously,
                                    // so arm for the FULL video length (+buffer), never a fixed 120s
                                    // which would force-advance any video longer than two minutes.
                                    const ytDuration = (typeof e.target.getDuration === 'function' ? e.target.getDuration() : 0) || 0;
                                    armWatchdog(item.duration || (ytDuration ? ytDuration + 30 : 1800), token);
                                }
                            },
                            'onError': () => setTimeout(() => advance('YouTube playback failed', token), 2000)
                        }
                    });
                }
                if (!window.YT || !window.YT.Player) {
                    // Load YouTube IFrame API if not loaded
                    if (!document.getElementById('yt-iframe-api')) {
                        const tag = document.createElement('script');
                        tag.id = 'yt-iframe-api';
                        tag.src = "https://www.youtube.com/iframe_api";
                        tag.onerror = () => setTimeout(() => advance('YouTube API failed to load', token), 2000);
                        document.body.appendChild(tag);
                    }
                    window.onYouTubeIframeAPIReady = loadYT;
                } else {
                    loadYT();
                }
            } else if (isImage(item.url)) {
                el = document.createElement('img');
                el.src = item.url;
                el.onload = () => { if (token === playbackToken) lastProgressAt = Date.now(); };
                el.onerror = () => setTimeout(() => advance('Image failed to load', token), 2000);
                el.style.width = '100vw';
                el.style.height = '100vh';
                el.style.objectFit = 'contain';
                playerDiv.appendChild(el);
                const duration = item.duration || 5;
                imageTimeout = setTimeout(() => advance('Image duration elapsed', token), duration * 1000);
            } else if (/\.(mp4|webm|ogg|mov)$/i.test(item.url)) {
                el = document.createElement('video');
                el.src = item.url;
                el.autoplay = true;
                el.muted = true;
                el.onended = () => advance('Video ended', token);
                el.onerror = () => setTimeout(() => advance('Video failed to load', token), 2000);
                el.onstalled = () => armWatchdog(30, token);
                el.ontimeupdate = () => { if (token === playbackToken) lastProgressAt = Date.now(); armWatchdog(120, token); };
                el.style.width = '100vw';
                el.style.height = '100vh';
                el.style.objectFit = 'contain';
                playerDiv.appendChild(el);
                armWatchdog(item.duration || 1800, token);
                const playAttempt = el.play();
                if (playAttempt && playAttempt.catch) playAttempt.catch(() => setTimeout(() => advance('Video autoplay failed', token), 2000));
            } else if (/\.(mp3|wav|aac|m4a)$/i.test(item.url)) {
                el = document.createElement('audio');
                el.src = item.url;
                el.autoplay = true;
                el.onended = () => advance('Audio ended', token);
                el.onerror = () => setTimeout(() => advance('Audio failed to load', token), 2000);
                el.onstalled = () => armWatchdog(30, token);
                el.ontimeupdate = () => { if (token === playbackToken) lastProgressAt = Date.now(); armWatchdog(120, token); };
                el.style.width = '100vw';
                el.style.height = '100vh';
                playerDiv.appendChild(el);
                armWatchdog(item.duration || 1800, token);
                const playAttempt = el.play();
                if (playAttempt && playAttempt.catch) playAttempt.catch(() => setTimeout(() => advance('Audio autoplay failed', token), 2000));
            } else if (/^https?:\/\//.test(item.url)) {
                // Display website in iframe
                el = document.createElement('iframe');
                el.src = item.url;
                el.allow = 'autoplay; fullscreen';
                el.sandbox = 'allow-scripts allow-autoplay';
                el.style.width = '100vw';
                el.style.height = '100vh';
                el.style.border = 'none';
                playerDiv.appendChild(el);
                // Use duration or default 30s for websites
                const duration = item.duration || 30;
                imageTimeout = setTimeout(() => advance('Website duration elapsed', token), duration * 1000);
            } else {
                setStatus('Unsupported media type');
                imageTimeout = setTimeout(() => advance('Unsupported media type', token), 2000);
            }
        }
        // ...existing code...



        function loadInitialPlaylist() {
          fetch(playlistUrl, { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
            .then(md => {
                const parsedItems = parsePlaylist(md);
                if (parsedItems.length === 0) {
                    stopPlayback('No items in playlist.');
                    setTimeout(loadInitialPlaylist, 30000);
                    return;
                }
                items = parsedItems;
                playItem(0);
            })
            .catch(() => {
                setStatus('Failed to load playlist; retrying.');
                setTimeout(loadInitialPlaylist, 30000);
            });
        }
        loadInitialPlaylist();
        // Periodically check for playlist updates and restart play if changed
        const htmlUrl = `${baseURL}player-2.html`;
        let lastHtmlHash = null;
        let lastPlaylistHash = null;

        async function hashString(str) {
            if (window.crypto && crypto.subtle && window.TextEncoder) {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
            let hash = 2166136261;
            for (let i = 0; i < str.length; i++) hash = Math.imul(hash ^ str.charCodeAt(i), 16777619);
            return String(hash >>> 0);
        }

        async function checkHtmlUpdate() {
            try {
                const r = await fetch(htmlUrl, { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const html = await r.text();
                const hash = await hashString(html);
                if (lastHtmlHash === null) {
                    lastHtmlHash = hash;
                } else if (hash !== lastHtmlHash) {
                    location.reload();
                }
            } catch (e) { /* ignore */ }
        }

        async function checkPlaylistUpdate() {
            try {
                const r = await fetch(playlistUrl, { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const md = await r.text();
                const hash = await hashString(md);
                if (lastPlaylistHash === null) {
                    lastPlaylistHash = hash;
                } else if (hash !== lastPlaylistHash) {
                    lastPlaylistHash = hash;
                    const parsedItems = parsePlaylist(md);
                    if (parsedItems.length === 0 && hasMalformedNonEntryContent(md)) {
                        setStatus('Ignored malformed playlist update; continuing last valid playlist.');
                        return;
                    }
                    if (parsedItems.length === 0) {
                        stopPlayback('Playlist was cleared.');
                        return;
                    }
                    items = parsedItems;
                    playItem(0); // restart play from first item
                }
            } catch (e) { /* ignore */ }
        }

        checkHtmlUpdate();
        setInterval(checkHtmlUpdate, 5 * 60000); // check every 5 minutes

        checkPlaylistUpdate();
        setInterval(checkPlaylistUpdate, 60000); // check playlist every 60 seconds
        setInterval(() => {
            if (items.length && Date.now() - lastProgressAt > 2 * 60 * 60 * 1000) {
                advance('Global playback watchdog');
            }
        }, 60000);
    </script>
</body>

</html>
